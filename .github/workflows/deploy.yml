name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployments read the built artifact, write the site and mint an OIDC
# token for actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment half-way; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      # The repository is served from https://<owner>.github.io/<repo>/, so the
      # asset base must match the repository name rather than "/".
      - name: Build with the repository base path
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the build as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
